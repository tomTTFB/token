<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Token Setup{% endblock %}</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-sm navbar-dark border-bottom border-secondary-subtle mb-4">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">
                <span class="text-token-blue">&#9679;</span> Token Setup
            </a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
                <a class="nav-link {% if request.path == '/flash' %}active{% endif %}" href="/flash">Flash</a>
                <a class="nav-link {% if request.path == '/accounts/add' %}active{% endif %}" href="/accounts/add">Add Account</a>
            </div>
        </div>
    </nav>
    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
