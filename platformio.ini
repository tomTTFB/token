; PlatformIO project for the LilyGO T-Embed CC1101 (ESP32-S3 + ST7789 display + CC1101 sub-GHz radio)

[platformio]
boards_dir = boards
default_envs = T_Embed_CC1101

[env:T_Embed_CC1101]
platform = espressif32@6.13.0
board = T_Embed_CC1101
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; --- TFT_eSPI setup for the T-Embed's ST7789 panel (170x320) ---
    ; Pin values sourced from Xinyuan-LilyGO/T-Embed-CC1101 examples/utilities.h
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_INVERSION_ON=1
    -DUSE_HSPI_PORT=1
    -DTFT_BL=21
    -DTFT_MISO=10
    -DTFT_MOSI=9
    -DTFT_SCLK=11
    -DTFT_CS=41
    -DTFT_DC=16
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

    ; --- Battery charger/gauge (BQ25896) via XPowersLib ---
    -DXPOWERS_CHIP_BQ25896

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    adafruit/Adafruit NeoPixel@^1.12.3
    mathertel/RotaryEncoder@^1.5.3
    lewisxhe/XPowersLib@^0.3.3
